name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-${{ hashFiles('skillfortat-client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: cd skillfortat-client && npm install --legacy-peer-deps

      - name: Run lint
        run: cd skillfortat-client && npm run lint

      - name: Run tests with coverage
        run: cd skillfortat-client && npm test -- --watchAll=false --coverage

      - name: Build React app
        run: cd skillfortat-client && npm run build

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-client:latest ./skillfortat-client

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-client:latest
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push frontend image to Docker Hub
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-client:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-client:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-client:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-client:${{ github.sha }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backend-${{ hashFiles('skillfortat-server/package-lock.json') }}
          restore-keys: ${{ runner.os }}-backend-

      - name: Install dependencies
        run: cd skillfortat-server && npm install --legacy-peer-deps

      - name: Run lint
        run: cd skillfortat-server && npm run lint

      - name: Audit dependencies
        run: cd skillfortat-server && npm audit --audit-level=high

      # ✅ CHANGED: added --coverageReporters=lcov to generate coverage/lcov.info
      - name: Run tests with coverage
        run: cd skillfortat-server && npm test -- --coverage --coverageReporters=lcov text

      # ✅ CHANGED: added sonar.javascript.lcov.reportPaths so SonarCloud reads the coverage
      - name: Analyze with SonarCloud
        run: |
          cd skillfortat-server
          npx sonar-scanner \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions=src/**/*.test.js,src/**/__tests__/**/*.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-server:latest ./skillfortat-server

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-server:latest
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image to Docker Hub
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-server:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-server:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-server:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillfortat-server:${{ github.sha }}